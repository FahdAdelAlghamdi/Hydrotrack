<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HydroTrack · رادع الوجيب</title>
<meta name="description" content="HydroTrack (Radea Al-Wajeeb): early warning and home follow-up for heart-failure patients">
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 40 40' aria-hidden='true'%3E%3Cdefs%3E%3ClinearGradient id='lg1' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%234FB3F6'/%3E%3Cstop offset='1' stop-color='%231E6FD0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M20 3.5C20 3.5 8.5 16.2 8.5 24a11.5 11.5 0 0 0 23 0C31.5 16.2 20 3.5 20 3.5z' fill='url(%23lg1)'/%3E%3Cpath d='M10.8 24.5h5.2l2.1-4.4 3.5 8.6 2.3-4.2h5.3' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='27.6' cy='15.2' r='2.6' fill='%23E5484D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-basic-dist-min@2.35.2/plotly-basic.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<style>
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --ink:#0F1E33; --ink2:#4A5A70; --ink3:#8593A6; --line:#E3E8F0;
  --brand:#0B3C5D; --brand2:#1F5F8B; --heart:#E5484D;
  --ok:#22A06B; --med:#E9A800; --measure:#2F80ED; --warn:#F07F23; --crit:#E5484D; --emerg:#B4232A; --sugar:#7B4FD0;
  --okbg:#E6F6EE; --medbg:#FFF6D6; --measurebg:#E7F0FD; --warnbg:#FFEFE1; --critbg:#FDE8E9; --sugarbg:#F1E9FB;
  --r:18px; --shadow:0 1px 2px rgba(15,30,51,.06),0 4px 16px rgba(15,30,51,.06);
  --font:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

/* header + demo bar */
header{background:var(--brand);color:#fff}
.hd{display:flex;align-items:center;gap:14px;padding:14px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo svg{width:34px;height:34px}
.logo .arid{font-size:14px;font-weight:600;color:#9FC3E3;padding-inline-start:10px;border-inline-start:1px solid rgba(255,255,255,.25)}
.tag{color:#B9CFE2;font-size:13px;font-weight:500}
.spacer{flex:1}
.lang{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:#B9CFE2;padding:12px 16px;font-size:15px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:#fff;border-bottom-color:#fff}
.demo{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(15,30,51,.05)}
.db{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
.dayinfo{min-width:160px}
.dayinfo b{font-size:15px}
.dayinfo small{display:block;color:var(--ink3);font-size:12px}
.ctrl{display:flex;align-items:center;gap:6px;flex:1;min-width:200px}
.ctrl input[type=range]{flex:1;accent-color:var(--brand)}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;display:grid;place-items:center;flex:none}
.ib.play{background:var(--brand);color:#fff;border-color:var(--brand)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:600;color:var(--ink2)}
.chip:hover{border-color:var(--brand2);color:var(--brand)}
.chip i{font-style:normal;margin-inline-end:4px}
.sim{font-size:11.5px;color:var(--ink3);padding:0 0 8px}
main{padding:20px 0 48px}
.view{display:none}
.view.on{display:block}

/* shared layout */
.pw,.fam{display:grid;grid-template-columns:400px 1fr;gap:24px;align-items:start}
.side{display:grid;gap:20px}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.panel h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--ink3)}
.meter{height:10px;border-radius:99px;background:#EEF1F6;overflow:hidden;position:relative}
.meter i{display:block;height:100%;border-radius:99px;transition:width .3s}
.stag{display:inline-block;border-radius:8px;padding:1px 7px;font-size:11.5px;font-weight:700;margin-inline-end:4px;background:#EEF1F6;color:var(--ink2)}
.stag.clinical{background:var(--warnbg);color:#A04A00}
.stag.glucose{background:var(--sugarbg);color:#6B3FB8}
.stag.adherence{background:var(--measurebg);color:var(--brand)}
@keyframes flash{from{opacity:1}to{opacity:.3}}

/* phone */
.phone{width:100%;max-width:400px;margin:0 auto;background:#0F1E33;border-radius:44px;padding:12px;box-shadow:0 20px 50px rgba(15,30,51,.25)}
.screen{background:var(--bg);border-radius:34px;overflow:hidden;height:780px;overflow-y:auto;scrollbar-width:thin;position:relative}
.sbar{display:flex;justify-content:space-between;padding:12px 24px 4px;font-size:13px;font-weight:600}
.app{padding:8px 16px 24px;display:grid;gap:14px}
.hello{font-size:22px;font-weight:700;margin:6px 0 0}
.hello small{display:block;font-size:14px;color:var(--ink3);font-weight:500}
.status{border-radius:22px;padding:18px;color:#fff;display:grid;gap:10px}
.status .t{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.status .m{font-size:16px;line-height:1.6}
.status .row{display:flex;gap:8px;flex-wrap:wrap}
.status.flash{animation:flash .6s ease-in-out 6 alternate}
.sbtn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:14px;padding:10px 14px;font-size:15px;font-weight:600;text-decoration:none}
.lv0{background:var(--ok)} .lv1,.lv2{background:var(--warn)} .lv3{background:var(--crit)} .lv4{background:var(--emerg)} .lvg{background:var(--sugar)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:16px;padding:12px 14px;border:1px solid var(--line)}
.tile .k{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tile .k em{font-style:normal;margin-inline-start:auto;font-size:10.5px;color:var(--ink3);background:#F0F3F8;border-radius:6px;padding:1px 6px;white-space:nowrap}
.tile .v{font-size:24px;font-weight:700;margin-top:2px}
.tile .v small{font-size:13px;font-weight:500;color:var(--ink3)}
.tile .d{font-size:12px;color:var(--ink3)}
.tile.bad{border-color:var(--warn);background:var(--warnbg)}
.tile.bad .d{color:#A04A00;font-weight:600}
.sect{background:#fff;border-radius:18px;padding:14px;border:1px solid var(--line)}
.sect h4{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.med{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.med:first-of-type{border-top:0}
.med .n{flex:1;font-size:15px;font-weight:600}
.med .n small{display:block;font-weight:500;color:var(--ink3);font-size:12.5px}
.take{border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--med);color:#3A2A00}
.taken{border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px;background:var(--okbg);color:var(--ok);white-space:nowrap}
.meal{display:grid;grid-template-columns:72px 1fr;gap:8px;padding:6px 0;font-size:14.5px}
.meal b{color:var(--ink2);font-weight:600}
.limits{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.limits span{background:var(--measurebg);color:var(--brand);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.linkbtn{background:none;border:0;color:var(--brand2);font-weight:600;font-size:14px;padding:6px 0}
.no{display:grid;gap:6px;margin-top:8px}
.no div{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 10px;background:var(--critbg);border-radius:10px}
.no div span:last-child{color:var(--ok);font-weight:600}
.call{border:0;border-radius:14px;padding:13px;font-weight:700;font-size:15px;color:#fff;background:var(--brand);text-align:center;text-decoration:none;display:block}
.call.alt{background:#fff;color:var(--brand);border:1px solid var(--line)}

/* voice assistant */
.voice{display:grid;gap:8px}
.bub{padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.6;max-width:90%}
.bub.sys{background:#E7F0FD;color:#0B3C5D;justify-self:start}
.bub.me{background:#0B3C5D;color:#fff;justify-self:end}
.vrow{display:flex;gap:6px;flex-wrap:wrap}
.vrow button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:600}
.vrow .mic{background:var(--heart);color:#fff;border-color:var(--heart)}
.vrow .mic.on{animation:flash .7s infinite alternate}
.vtrig{display:flex;gap:6px;flex-wrap:wrap}
.vt{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 11px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--brand)}
.legend{display:grid;gap:8px}
.legend div{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;font-size:14px}
.legend em{font-style:normal;color:var(--ink3);font-size:12.5px;font-family:monospace;direction:ltr}
.flashbar{height:8px;border-radius:99px;background:#EEF1F6;transition:background .3s}
.flashbar.on{animation:flash .5s infinite alternate}

/* engine panel */
.eng{display:grid;gap:10px}
.sig{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sig div{border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:12.5px;color:var(--ink2)}
.sig div b{display:block;font-size:18px;margin-bottom:2px}
.sig div.on{background:var(--warnbg);border-color:#F9C79A;color:#A04A00}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ladder div{border-radius:12px;padding:10px 6px;font-size:12.5px;font-weight:600;background:#F0F3F8;color:var(--ink3);text-align:center;line-height:1.4}
.ladder div.on{color:#fff}
.reasons{margin:0;padding-inline-start:18px;display:grid;gap:4px;font-size:14px;line-height:1.55}
.note{font-size:13.5px;background:#F0F3F8;border-radius:10px;padding:8px 10px;line-height:1.55}
.note.good{background:var(--okbg);color:#0E6B45;font-weight:600}
.note.warn{background:var(--warnbg);color:#A04A00;font-weight:600}

/* band */
.bandg{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
.stage{position:relative;background:radial-gradient(circle at 50% 30%,#1B4A6E,#0A1C2E 72%);border-radius:var(--r);height:600px;overflow:hidden;box-shadow:var(--shadow);touch-action:none}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.stage .hud{position:absolute;inset-inline:16px;top:14px;display:flex;justify-content:space-between;gap:10px;color:#CFE0F0;font-size:13px;pointer-events:none}
.stage .ctl{position:absolute;inset-inline:16px;bottom:14px;background:rgba(7,20,34,.78);border-radius:14px;padding:12px 14px;color:#fff;display:grid;gap:6px}
.stage .ctl label{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600}
.stage .ctl input{width:100%;accent-color:#F07F23}
.stage .ctl small{color:#B4C8DB;font-size:12.5px;line-height:1.55}
.stage .fallback{position:absolute;inset:0;display:grid;place-items:center;color:#CFE0F0;font-size:14px;padding:30px;text-align:center}
.sensors{display:grid;gap:10px}
.sensor{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.sensor b{display:block;font-size:14.5px;margin-bottom:2px}
.sensor span{font-size:13.5px;color:var(--ink2);line-height:1.6}
.sensor .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--measurebg)}
.live{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.live div{background:#F7F9FC;border-radius:12px;padding:10px}
.live div.bad{background:var(--warnbg)}
.live small{display:block;color:var(--ink3);font-size:12px}
.live b{font-size:18px}
.live b small{display:inline;font-size:12px}

/* family + automatic call */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{text-align:center;font-size:11.5px;color:var(--ink3)}
.week div i{display:block;height:28px;border-radius:8px;margin-bottom:4px}
.feed{display:grid;gap:10px}
.fi{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;font-size:14px;line-height:1.55}
.fi .bar{border-radius:99px}
.fi small{color:var(--ink3);display:block;margin-bottom:2px}
.callrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chain{display:grid}
.cstep{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;position:relative}
.cstep .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:#EEF1F6;color:var(--ink2);z-index:1}
.cstep.ok .n{background:var(--ok);color:#fff}
.cstep.miss .n{background:#B8C3D1;color:#fff}
.cstep.wait .n{background:#fff;border:2px dashed #C9D2DE}
.cstep:not(:last-child)::after{content:"";position:absolute;inset-inline-start:14px;top:40px;bottom:-10px;width:2px;background:var(--line)}
.cstep b{font-size:14.5px}
.cstep small{color:var(--ink3);font-size:12.5px;display:block}
.pill{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.miss{background:#EEF1F6;color:var(--ink2)}
.trigger{background:var(--critbg);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.65;margin-bottom:10px}
.incoming{position:absolute;inset:0;z-index:5;background:linear-gradient(180deg,#0B3C5D,#06182A);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:60px 22px 46px;text-align:center}
.incoming.on{display:flex}
.incoming .who{font-size:25px;font-weight:700;margin-top:16px}
.incoming .sub{color:#B9CFE2;font-size:15px;margin-top:6px}
.incoming .msg{font-size:15px;line-height:1.8;background:rgba(255,255,255,.08);border-radius:16px;padding:14px}
.incoming .keys{display:flex;gap:28px;align-items:center}
.incoming .k{width:74px;height:74px;border-radius:50%;border:0;font-size:24px;font-weight:700;color:#fff}
.incoming .done{font-size:18px;font-weight:700;color:#7EE2B0}
.ringa{width:96px;height:96px;border-radius:50%;background:#E5484D;display:grid;place-items:center;font-size:40px;margin:0 auto;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.6)}100%{box-shadow:0 0 0 26px rgba(229,72,77,0)}}

/* doctor */
.rep{display:grid;gap:18px}
.rhead{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.pinfo{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;font-size:14px}
.pinfo div small{display:block;color:var(--ink3);font-size:12px}
.pinfo div b{font-weight:600}
.ai{border-radius:var(--r);padding:18px;background:linear-gradient(135deg,#0B3C5D,#1F5F8B);color:#fff;display:grid;gap:10px}
.ai .lbl{font-size:12px;color:#B9CFE2;font-weight:600}
.ai p{margin:0;font-size:16px;line-height:1.7}
.ai .disc{font-size:12px;color:#B9CFE2}
.sbarg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sbarg div{background:#F7F9FC;border-radius:14px;padding:12px;font-size:14px;line-height:1.65}
.sbarg b{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--brand2);margin-bottom:4px}
.sbarg b i{font-style:normal;width:24px;height:24px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.kpi small{color:var(--ink3);font-size:12.5px;display:block;min-height:32px}
.kpi b{font-size:26px;font-weight:700}
.kpi b small{display:inline;font-size:13px;min-height:0}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chart{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 4px}
.chart h4{margin:0 0 2px;font-size:15px}
.chart p{margin:0;font-size:12.5px;color:var(--ink3)}
.chart .plot{height:250px}
.chart.wide{grid-column:1/-1}
.gap{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.gap div{background:#F7F9FC;border-radius:14px;padding:12px}
.gap small{color:var(--ink3);font-size:12.5px;display:block}
.gap b{font-size:20px}
table.log{width:100%;border-collapse:collapse;font-size:13.5px}
table.log th{text-align:start;color:var(--ink3);font-weight:600;padding:8px;border-bottom:1px solid var(--line);font-size:12.5px}
table.log td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
.lvtag{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.rtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--brand);color:#fff}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--brand);color:#fff}

/* how */
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.step b{display:block;font-size:28px;color:var(--brand2)}
.step h4{margin:6px 0;font-size:16px}
.step p{margin:0;color:var(--ink2);font-size:14px;line-height:1.7}
h2.sec{margin:30px 0 14px;font-size:20px}
/* how it works: hero */
.hhero{background:linear-gradient(135deg,#0B3C5D,#0A2540);color:#fff;border-radius:22px;padding:28px 30px;box-shadow:var(--shadow)}
.hhero .hk{color:#7FD4F5;font-weight:700;font-size:14px}
.hhero h2{margin:8px 0 8px;font-size:26px;line-height:1.5}
.hhero p{margin:0;color:#C6D7E8;font-size:15px;line-height:1.8;max-width:900px}
.hchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hchips span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.hchips i{font-style:normal;color:#7FD4F5;opacity:.8;align-self:center}
/* how it works: flow */
.flowin{display:grid;grid-template-columns:1fr 44px 1fr;align-items:stretch}
.flowin .arr{display:grid;place-items:center;color:var(--ink3);font-size:26px}
[dir=ltr] .flowin .arr{transform:scaleX(-1)}
.fstep{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.fstep .ic{width:52px;height:52px;border-radius:14px;background:var(--measurebg);display:grid;place-items:center;font-size:26px;flex:none}
.fstep h4{margin:2px 0 6px;font-size:17px}
.fstep p{margin:0;color:var(--ink2);font-size:14px;line-height:1.75}
.flowthen{display:flex;align-items:center;gap:12px;margin:14px 0;color:var(--ink3);font-weight:700;font-size:14px}
.flowthen:before,.flowthen:after{content:"";flex:1;height:1px;background:var(--line)}
.flowthen span{background:var(--bg);padding:0 4px}
.flowout{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ocard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--c)}
.ocard .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ocard .ic{font-size:28px}
.ocard .lv{font-size:12px;font-weight:700;color:var(--c);background:var(--cb);border-radius:999px;padding:3px 10px;white-space:nowrap}
.ocard h4{margin:0;font-size:16px}
.ocard p{margin:0;color:var(--ink2);font-size:14px;line-height:1.7}
/* how it works: band features */
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.fcard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.fcard .hd{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.fcard .ic{width:46px;height:46px;border-radius:50%;background:var(--okbg);display:grid;place-items:center;font-size:22px;flex:none}
.fcard h4{margin:0;font-size:16px}
.fcard ul{list-style:none;margin:0;padding:0}
.fcard li{position:relative;padding-inline-start:22px;color:var(--ink2);font-size:14px;line-height:1.65;margin-top:6px}
.fcard li:before{content:"✓";position:absolute;inset-inline-start:0;top:0;color:var(--ok);font-weight:800}
.fimg{background:#E8F2F3;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;grid-row:span 2;max-height:620px}
.fcard.wide{grid-column:1/-1;display:flex;align-items:center;gap:24px}
.fcard.wide .hd{margin:0;flex:none}
.fcard.wide ul{display:flex;flex-wrap:wrap;gap:6px 28px}
.fcard.wide li{margin:0}
.fimg img{width:100%;flex:1;min-height:0;object-fit:contain;padding:16px 16px 0}
.fimg small{display:block;padding:10px 16px 14px;color:var(--ink2);font-size:12.5px;line-height:1.6}

.modal{position:fixed;inset:0;background:rgba(15,30,51,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:22px;max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:20px}
.mbox table{width:100%;border-collapse:collapse;font-size:14px}
.mbox td,.mbox th{padding:8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.mbox th{color:var(--ink3);font-size:12.5px}
.qr{display:grid;place-items:center;margin:12px 0}
.qr svg{width:220px;height:220px}
footer{color:var(--ink3);font-size:12.5px;text-align:center;padding:24px 16px}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.how{grid-template-columns:1fr 1fr}.flowout{grid-template-columns:1fr 1fr}.feat{grid-template-columns:1fr 1fr}.fimg{grid-row:auto;grid-column:1/-1;max-height:420px}}
@media (max-width:900px){
  .pw,.fam,.rhead,.charts,.bandg{grid-template-columns:1fr}
  .gap,.sbarg,.pinfo{grid-template-columns:1fr 1fr}
  .phone{border-radius:0;padding:0;box-shadow:none;background:none;max-width:none}
  .screen{border-radius:0;height:auto;min-height:640px;overflow:visible;background:none}
  .sbar{display:none}
  .app{padding:0}
  .stage{height:460px}
}
@media (max-width:560px){.fcard.wide{display:block}.fcard.wide .hd{margin-bottom:10px}.fcard.wide ul{display:block}.fcard.wide li{margin-top:6px}.kpis{grid-template-columns:1fr 1fr}.how{grid-template-columns:1fr}.flowin{grid-template-columns:1fr}.flowin .arr{transform:rotate(-90deg)}[dir=ltr] .flowin .arr{transform:rotate(90deg)}.flowout,.feat{grid-template-columns:1fr}.fimg{grid-row:auto}.hhero h2{font-size:21px}.sig{grid-template-columns:repeat(3,1fr)}.ladder{grid-template-columns:1fr 1fr}.live{grid-template-columns:1fr 1fr}}
@media print{
  header,.demo,nav,footer,.rtools,.noprint{display:none!important}
  body{background:#fff}
  .view{display:none!important} #v-doctor{display:block!important}
  .chart,.kpi,.panel{box-shadow:none;border:1px solid var(--line);break-inside:avoid}
}

/* night glucose timeline (two-step escalation) */
.night{display:flex;flex-direction:column;gap:0;border-inline-start:2px solid var(--line);margin-inline-start:6px}
.nev{display:grid;grid-template-columns:44px 10px 1fr;align-items:start;gap:8px;padding:6px 0 6px 0;font-size:13px;line-height:1.55;position:relative}
.nev .tm{font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;padding-inline-start:8px}
.nev i{width:10px;height:10px;border-radius:50%;margin-top:5px}
.nev.s2{background:#FDECEC;border-radius:10px;font-weight:600}

</style>

/* Interactive 3D model of the HydroTrack ankle band (three.js).
   Screen-free, waterproof silicone band worn under clothing.
   Swelling is exaggerated x4 on screen so millimetre changes are visible. */
const Band3D = (() => {
  let renderer, scene, camera, group, leg, band, line, led, pod, legProfile0, el, raf;
  let swell = 0, dragging = false, lastX = 0, lastY = 0, rotY = -0.6, rotX = 0.12, idle = 0, ready = false;
  const SWELL_SCALE = 0.0016 * 4;                       // scene units per mm circumference (exaggerated)
  const BAND_Y = 0.42, BASE_R = 0.385;

  function legPoints(s) {
    // [radius, height] from heel to mid-calf; swelling widens the ankle region most
    const prof = [[0.30, -0.62], [0.42, -0.46], [0.40, -0.25], [0.37, 0.05], [0.37, 0.35], [0.385, 0.55],
                  [0.43, 0.95], [0.51, 1.45], [0.58, 1.95], [0.60, 2.35], [0.59, 2.7]];
    return prof.map(([r, y]) => {
      const w = Math.exp(-Math.pow((y - 0.35) / 0.55, 2));          // swelling weight around the ankle
      return new THREE.Vector2(r + s * SWELL_SCALE * 6.0 * w, y);
    });
  }

  function bandGeometry(r) {
    // rounded-rectangle cross-section revolved around the leg axis
    const h = 0.30, t = 0.07, k = 0.03, pts = [];
    const add = (x, y) => pts.push(new THREE.Vector2(x, y));
    add(r, -h / 2 + k); add(r + k * 0.3, -h / 2); add(r + t - k * 0.3, -h / 2); add(r + t, -h / 2 + k);
    add(r + t, h / 2 - k); add(r + t - k * 0.3, h / 2); add(r + k * 0.3, h / 2); add(r, h / 2 - k); add(r, -h / 2 + k);
    return new THREE.LatheGeometry(pts, 96);
  }

  function logoTexture() {
    // small embossed mark on the sensor pod (no screen): water drop with a pulse line
    const c = document.createElement("canvas"); c.width = 256; c.height = 256;
    const g = c.getContext("2d");
    g.fillStyle = "rgba(255,255,255,0.0)"; g.fillRect(0, 0, 256, 256);
    g.fillStyle = "rgba(235,242,248,0.55)";
    g.beginPath(); g.moveTo(128, 34); g.bezierCurveTo(128, 34, 62, 110, 62, 152); g.arc(128, 152, 66, Math.PI, 0, true);
    g.bezierCurveTo(194, 110, 128, 34, 128, 34); g.fill();
    g.strokeStyle = "rgba(90,98,108,0.9)"; g.lineWidth = 10; g.lineJoin = "round"; g.lineCap = "round"; g.beginPath();
    g.moveTo(76, 156); g.lineTo(104, 156); g.lineTo(116, 132); g.lineTo(136, 182); g.lineTo(150, 156); g.lineTo(180, 156); g.stroke();
    const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4; return tex;
  }

  function build() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
    camera.position.set(0, 1.25, 7.8);
    camera.lookAt(0, 0.85, 0);
    scene.add(new THREE.HemisphereLight(0xDDE8F5, 0x1A2533, 0.9));
    const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(3, 4, 5); scene.add(key);
    const rim = new THREE.DirectionalLight(0x7FB2E5, 0.6); rim.position.set(-4, 2, -3); scene.add(rim);

    group = new THREE.Group(); scene.add(group);

    legProfile0 = legPoints(0);
    leg = new THREE.Mesh(new THREE.LatheGeometry(legProfile0, 96),
      new THREE.MeshStandardMaterial({color: 0xC8A089, roughness: 0.75, metalness: 0, transparent: true, opacity: 0.93}));
    group.add(leg);
    const foot = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32),
      new THREE.MeshStandardMaterial({color: 0xC8A089, roughness: 0.75, transparent: true, opacity: 0.93}));
    foot.scale.set(0.42, 0.24, 1.05); foot.position.set(0, -0.56, 0.62); group.add(foot);

    band = new THREE.Group(); band.position.y = BAND_Y; group.add(band);
    band.add(new THREE.Mesh(bandGeometry(BASE_R + 0.012),
      new THREE.MeshStandardMaterial({color: 0x8F969E, roughness: 0.8, metalness: 0.0})));   // matte medical silicone

    // stretch-sensor trace around the band (colour = tension)
    line = new THREE.Mesh(new THREE.TorusGeometry(BASE_R + 0.085, 0.008, 12, 160),
      new THREE.MeshStandardMaterial({color: 0x22A06B, emissive: 0x22A06B, emissiveIntensity: 0.6}));
    line.rotation.x = Math.PI / 2; band.add(line);

    // bioimpedance electrodes on the inner surface (seen through the skin)
    for (let i = 0; i < 4; i++) {
      const a = Math.PI * (0.65 + i * 0.23);
      const e = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.16, 0.012),
        new THREE.MeshStandardMaterial({color: 0xD4AF37, metalness: 0.9, roughness: 0.3}));
      e.position.set(Math.sin(a) * (BASE_R + 0.008), 0, Math.cos(a) * (BASE_R + 0.008)); e.rotation.y = a; band.add(e);
    }

    // optical (PPG) sensor on the inner side, touching the skin: red + green light
    [[0xFF3B3B, -0.06], [0x3BFF7A, 0.06]].forEach(([c, x]) => {
      const p = new THREE.Mesh(new THREE.CircleGeometry(0.035, 24),
        new THREE.MeshBasicMaterial({color: c, transparent: true, opacity: 0.85, side: THREE.DoubleSide}));
      p.position.set(x, 0, BASE_R + 0.004); band.add(p);
    });

    // sealed sensor pod (no screen): motion sensor, battery, vibration motor, radio
    pod = new THREE.Group();
    const body = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32),
      new THREE.MeshStandardMaterial({color: 0x7A8189, roughness: 0.55, metalness: 0.05}));
    body.scale.set(0.27, 0.15, 0.07); pod.add(body);
    const mark = new THREE.Mesh(new THREE.PlaneGeometry(0.13, 0.13),
      new THREE.MeshBasicMaterial({map: logoTexture(), transparent: true}));
    mark.position.set(0, 0.01, 0.071); pod.add(mark);
    led = new THREE.Mesh(new THREE.SphereGeometry(0.012, 16, 12),   // tiny status light only
      new THREE.MeshStandardMaterial({color: 0x22A06B, emissive: 0x22A06B, emissiveIntensity: 1.4}));
    led.position.set(0.17, -0.06, 0.05); pod.add(led);
    pod.position.set(0, 0, BASE_R + 0.11); band.add(pod);

    renderer = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true});
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    el.appendChild(renderer.domElement);
    resize();
    new ResizeObserver(resize).observe(el);

    const c = renderer.domElement;
    c.addEventListener("pointerdown", e => { dragging = true; lastX = e.clientX; lastY = e.clientY; c.setPointerCapture(e.pointerId); c.style.cursor = "grabbing"; });
    c.addEventListener("pointermove", e => {
      if (!dragging) return;
      rotY += (e.clientX - lastX) * 0.01; rotX = Math.max(-0.5, Math.min(0.6, rotX + (e.clientY - lastY) * 0.006));
      lastX = e.clientX; lastY = e.clientY; idle = 0;
    });
    const up = () => { dragging = false; c.style.cursor = "grab"; };
    c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up);
    ready = true;
    loop();
  }

  function resize() {
    if (!renderer) return;
    const w = el.clientWidth, h = el.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }

  function loop() {
    raf = requestAnimationFrame(loop);
    if (!dragging && ++idle > 120) rotY += 0.004;
    group.rotation.y = rotY; group.rotation.x = rotX;
    renderer.render(scene, camera);
  }

  function tensionColor(mm) {
    return mm >= 11 ? 0xE5484D : mm >= 4 ? 0xF07F23 : 0x22A06B;
  }

  return {
    init(container) {
      el = container;
      if (!window.THREE) { el.insertAdjacentHTML("beforeend", '<div class="fallback">3D model needs an internet connection (three.js).</div>'); return false; }
      try { build(); return true; } catch (e) { el.insertAdjacentHTML("beforeend", '<div class="fallback">WebGL is not available on this device.</div>'); return false; }
    },
    setSwell(mm) {
      if (!ready) return;
      swell = mm;
      leg.geometry.dispose(); leg.geometry = new THREE.LatheGeometry(legPoints(mm), 96);
      const k = (BASE_R + mm * SWELL_SCALE * 6.0) / BASE_R;
      band.scale.set(k, 1, k);
      const col = tensionColor(mm);
      line.material.color.setHex(col); line.material.emissive.setHex(col);
    },
    setAlert(hex) {
      if (!ready) return;
      const c = parseInt(hex.replace("#", ""), 16);
      led.material.color.setHex(c); led.material.emissive.setHex(c);
    },
    ready: () => ready,
  };
})();

   Reads the engine output (DATA) and replays it day by day. */
const DAYS = DATA.days, B = DATA.baseline, EP = DATA.episodes, TH = DATA.thresholds;
const MEDS = DATA.meds.map(m => Object.assign({id: m.id, time: m.time}, MED_INFO[m.id]));
const UNIQUE_MEDS = MEDS.filter((m, i, a) => a.findIndex(x => x.id === m.id) === i);

let voiceMode = null, convo = [], listening = false, showAvoid = false, manualSwell = false;
const takenLocal = {}, answered = {};

/* ---------------------------------------------------------------- helpers */
const t = k => T[lang][k] ?? k;
const fmt = (s, p) => s.replace(/\{(\w+)\}/g, (_, k) => p[k] ?? "");
const num = (v, d = 0) => v == null ? "—" : Number(v).toLocaleString(lang === "ar" ? "ar-SA-u-nu-latn" : "en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const sign = (v, d = 1) => (v > 0 ? "+" : "") + Number(v).toFixed(d);
const dateStr = s => { const [y, m, d] = s.split("-").map(Number); return lang === "ar" ? `${d} ${t("months")[m - 1]} ${y}` : `${t("months")[m - 1]} ${d}, ${y}`; };
const shortDate = s => { const [, m, d] = s.split("-").map(Number); return lang === "ar" ? `${d} ${t("months")[m - 1]}` : `${t("months")[m - 1]} ${d}`; };
const weekday = s => new Date(s + "T12:00:00").getDay();
const LV_COLOR = ["#22A06B", "#F07F23", "#F07F23", "#E5484D", "#B4232A"];
const SUGAR = "#7B4FD0";
const $ = id => document.getElementById(id);

const reasonText = ([c, p]) => fmt(t("rs_" + c), {...p, dev: p.dev != null ? sign(p.dev) : "", mm: p.mm != null ? sign(p.mm) : "", bia: p.bia != null ? sign(p.bia) : ""});
const noteText = ([c, p]) => fmt(t("nt_" + c), {...p, jump: p.jump != null ? sign(p.jump) : ""});
const visibleReasons = d => d.reasons.filter(r => !(r[0] === "trend" && d.under_review));
const streamTags = d => (d.streams || []).map(s => `<span class="stag ${s}">${t("stream_" + s)}</span>`).join("");

const ankleDev = d => d.ankle_am - B.ankle.median;
const eveningDev = d => d.ankle_pm - B.ankle.median;

function isTaken(day, mi) {
  if (takenLocal[`${day}-${mi}`]) return true;
  return MEDS[mi].diuretic ? DAYS[day].diuretic_taken : true;
}
const pendingMeds = day => MEDS.map((_, i) => i).filter(i => !isTaken(day, i));

function primaryStream(d) {
  if (d.level === 4) return "emergency";
  const s = d.streams || [];
  return s.includes("clinical") ? "clinical" : s.includes("glucose") ? "glucose" : s.includes("adherence") ? "adherence" : "ok";
}
function statusInfo(d) {          // {cls, icon, title, msg} for the patient's phone
  const p = primaryStream(d);
  if (p === "emergency") return {cls: "lv4", icon: "🚨", title: t("st4"), msg: t("sm4")};
  if (p === "glucose") {

function gluTile(d, tile) {

    const now = n.trace[n.trace.length - 1][1];
    return tile("🩸", t("r_glu"), "src_cgm", num(n.min), t("mgdl"), `${fmt(t("night_min_at"), {t: n.min_at})} · ${fmt(t("now_v"), {v: now})}`, true);
  }
  return tile("🩸", t("r_glu"), "src_cgm", num(d.glu_mean), t("mgdl"), `${t("day_mean")} · ${t("night_low")} ${num(d.glu_night_min)}`, d.glu_night_min < TH.glucose_low);
}
function nightBlock(d, withRule = false) {
  const n = d.glu_night;

  const rows = n.events.map(e => {
    if (e.kind === "patient_answered") answered = true;
    const key = e.kind === "patient_alert_repeat" ? (answered ? "ev_repeat_1515" : "ev_repeat_loud") : "ev_" + e.kind;
    const col = e.kind === "resolved" ? "var(--ok)" : e.kind.startsWith("family") ? "var(--heart)" : e.kind === "patient_answered" || e.kind === "treated" ? "var(--ok)" : SUGAR;

    return `<div class="nev${step2 ? " s2" : ""}"><span class="tm" dir="ltr">${e.t}</span><i style="background:${col}"></i><span>${fmt(t(key), {v: e.v, w: e.waited, who: e.by ? contactName(e.by) : ""})}</span></div>`;
  }).join("");

const ALERTS = {

  sugar: {color: SUGAR, ic: "🩸", vib: [200, 100, 200, 100, 200, 100, 200], pattern: "▮▮▮▮", q: "v_sugar"},
  alert: {color: "#F07F23", ic: "⚠️", vib: [300, 150, 300, 150, 300], pattern: "▮ ▮ ▮", q: "v_alert", yes: "say_bad", no: "say_fine",

  emerg: {color: "#E5484D", ic: "🚨", vib: [1000, 200, 1000, 200, 1000], pattern: "▮▮▮▮▮…", q: "v_emerg"},
};
function autoMode(d) {
  const p = primaryStream(d);
  if (p === "emergency") return "emerg";
  if (p === "glucose") return "sugar";
  if (p === "clinical") return "alert";
  if (d.weight == null) return "weigh";

}
function renderVoiceTriggers() {
  const keys = [["med", "t_med"], ["weigh", "t_weigh"], ["sugar", "t_sugar"], ["alert", "t_alert"], ["emerg", "t_emerg"]];
  $("vtrig").innerHTML = keys.map(([k, l]) => `<button class="vt" data-v="${k}"><span class="dot" style="background:${ALERTS[k].color}"></span>${ALERTS[k].ic} ${t(l)}</button>`).join("");
  document.querySelectorAll("#vtrig [data-v]").forEach(b => b.onclick = () => fire(b.dataset.v));
  $("legend").innerHTML = [["med", "lg_med"], ["weigh", "lg_measure"], ["sugar", "lg_sugar"], ["alert", "lg_warn"], ["emerg", "lg_crit"]]
    .map(([k, l]) => `<div><span class="dot" style="background:${ALERTS[k].color}"></span><span>${ALERTS[k].ic} ${t(l)}</span><em>${ALERTS[k].pattern}</em></div>`).join("")
    + `<div><span class="dot" style="background:#22A06B"></span><span>✅ ${t("lg_ok")}</span><em>▮</em></div>`;
}
function fire(mode) {
  voiceMode = mode;
  const a = ALERTS[mode];
  convo = [{who: "sys", text: t(a.q)}];
  buzz(a.vib);
  if (!hearing) speak(t(a.q));
  const st = $("pStatus"); if (st) { st.classList.remove("flash"); void st.offsetWidth; st.classList.add("flash"); }
  renderVoice();
}
function renderVoice() {
  const mode = voiceMode || autoMode(DAYS[cur]);
  const fb = $("flashbar");
  fb.style.background = mode ? ALERTS[mode].color : "#22A06B";
  fb.classList.toggle("on", hearing && !!mode);
  const box = $("voice");
  if (!mode) { box.innerHTML = `<div class="bub sys">✅ ${t("st0")}</div>`; return; }
  const a = ALERTS[mode];
  if (!convo.length) convo = [{who: "sys", text: t(a.q)}];
  const canReply = a.yes && convo.length === 1;
  box.innerHTML = convo.map(b => `<div class="bub ${b.who}">${b.text}</div>`).join("") +
    (canReply ? `<div class="vrow"><button class="mic ${listening ? "on" : ""}" id="micBtn">${listening ? t("listening") : t("mic")}</button><button data-say="yes">${t(a.yes)}</button><button data-say="no">${t(a.no)}</button></div>` : "");
  const mb = $("micBtn"); if (mb) mb.onclick = () => listen(mode);
  box.querySelectorAll("[data-say]").forEach(b => b.onclick = () => reply(mode, b.dataset.say === "yes", t(a[b.dataset.say]).replace(/[«»"]/g, "")));
}
const YES = /(أخذت|اخذت|خذيت|إيه|ايه|ايوه|أيوه|نعم|تم|أحس|احس|ضيق|yes|took|yeah|done|short)/i;
function reply(mode, yes, heard) {
  const a = ALERTS[mode];
  convo.push({who: "me", text: heard});
  const ans = t(yes ? a.onYes() : a.onNo());
  convo.push({who: "sys", text: ans});
  speak(ans); buzz([80]);
  renderVoice(); renderPatient();
}
function listen(mode) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { convo.push({who: "sys", text: t("no_mic")}); renderVoice(); return; }
  const r = new SR(); r.lang = t("speak_lang"); r.interimResults = false; r.maxAlternatives = 3;
  listening = true; renderVoice();
  r.onresult = e => {
    listening = false;
    const said = [...e.results[0]].map(x => x.transcript).join(" ");
    const isNo = /^\s*(لا|no)\b/i.test(e.results[0][0].transcript);
    reply(mode, !isNo && YES.test(said), `${t("heard")} «${e.results[0][0].transcript}»`);
  };
  r.onerror = r.onend = () => { if (listening) { listening = false; renderVoice(); } };
  try { r.start(); } catch (e) { listening = false; renderVoice(); }
}
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  try {
    const s = window.speechSynthesis; if (!s || hearing) return;
    s.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = t("speak_lang"); u.rate = .92;
    const v = s.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(lang)); if (v) u.voice = v;
    s.speak(u);
  } catch (e) {}
}

        return `<div class="cstep ${cls}"><span class="n">${i + 1}</span><div><b>${contactName(ct.name)}</b><small dir="ltr" style="text-align:${lang === "ar" ? "right" : "left"}">${ct.phone.replace(/(\+966)(\d{2})(\d{3})(\d{4})/, "$1 $2 $3 $4")}</small></div><span class="pill ${st === "confirmed" ? "ok" : "miss"}">${t("cs_" + st)}${l ? ` · ${l.seconds}${t("sec")}` : ""}</span></div>`;
      }).join("")}</div>`;
  } else {
    body = `<div class="note" style="margin-bottom:12px">${t("call_none")}</div>
      <b style="font-size:14px">${t("call_order")}</b>
      <div class="chain">${DATA.contacts.map((ct, i) => `<div class="cstep wait"><span class="n">${i + 1}</span><div><b>${contactName(ct.name)}</b></div><span></span></div>`).join("")}</div>`;
  }
  const night = d.glu_night ? `<div style="margin-bottom:14px">${nightBlock(d, true)}</div>` : "";
  $("callBox").innerHTML = head + night + body + `<button class="call" id="tryCall" style="margin-top:14px;width:100%">${t("try_call")}</button><p class="muted" style="margin:12px 0 0;font-size:12.5px;line-height:1.7">${t("call_note")}</p>`;
  $("tryCall").onclick = ringIncoming;
}
function ringIncoming() {
  const d = DAYS[cur];
  const stream = d.calls ? (d.streams.includes("glucose") ? "glucose" : d.level === 4 ? "emergency" : "clinical") : "glucose";
  const hypo = d.reasons.find(r => r[0] === "hypo");
  const msg = callMessage(stream, hypo ? hypo[1].v : 52);
  const box = $("incoming");
  box.innerHTML = `<div><div class="ringa">📞</div><div class="who">HydroTrack</div><div class="sub">${t("incoming_sub")}</div></div>
    <div class="msg">${msg}</div>
    <div class="keys"><button class="k" id="decl" style="background:#5B6B80">${t("decline")}</button><button class="k" id="press1" style="background:#22A06B">${t("press1")}</button></div>`;
  box.classList.add("on");
  buzz([600, 300, 600, 300, 600]);
  speak(msg);
  $("decl").onclick = () => { speechSynthesis && speechSynthesis.cancel(); box.classList.remove("on"); };
  $("press1").onclick = () => {
    speechSynthesis && speechSynthesis.cancel();
    box.querySelector(".keys").outerHTML = `<div class="done">${t("confirmed_txt")}</div>`;
    speak(t("confirmed_txt").replace("✓", ""));
    setTimeout(() => box.classList.remove("on"), 2600);
  };
}

/* ----------------------------------------------------------------- doctor */
const windowDays = () => DAYS.slice(Math.max(0, cur - period + 1), cur + 1);
function episodeIn(win) {
  const a = win[0].day, b = win[win.length - 1].day;
  return EP.find(e => e.start <= b && e.end >= a && e.first_alert <= b);
}
function medAdh(win) { const due = win.reduce((a, x) => a + x.doses_due, 0), took = win.reduce((a, x) => a + x.doses_taken, 0); return Math.round(took / due * 100); }
function aiSummary(win) {
  const d = DAYS[cur], e = episodeIn(win), sep = t("list_sep");
  const hypo = win.filter(x => x.glu_night_min < TH.glucose_low).sort((a, b) => a.glu_night_min - b.glu_night_min)[0];
  const wed = win.some(x => x.notes.some(n => n[0] === "swelling_resolved"));
  const extra = (hypo ? fmt(t(hypo.hypo_no_response ? "ai_hypo" : "ai_hypo1"), {v: hypo.glu_night_min, d: shortDate(hypo.date)}) : "") + (wed ? t("ai_wedding") : "");
  if (e && cur > e.end) return fmt(t("ai_after"), {s: shortDate(DAYS[e.start].date), e: shortDate(DAYS[e.end].date), early: e.symptoms_day - e.first_alert, m: e.missed_diuretic}) + extra;
  if (e) {
    let n = 0; for (let i = cur; i >= 0 && DAYS[i].congestion; i--) n++;
    const w = DAYS.slice(Math.max(0, e.start - 7), cur + 1);
    return fmt(t("ai_now"), {n: Math.max(n, 1), r: visibleReasons(d).map(reasonText).join(sep) || t("nt_improving"), m: w.filter(x => !x.diuretic_taken).length, salty: w.filter(x => !x.diet_ok).length}) + extra;
  }
  const valid = win.filter(x => !x.suspect && x.weight != null).map(x => Math.abs(x.weight - B.weight.median));
  return fmt(t("ai_ok"), {w: num(Math.max(...valid), 1), med: medAdh(win)}) + extra;
}
function renderSBAR(win) {
  const d = DAYS[cur], e = episodeIn(win);
  const hypos = win.filter(x => x.glu_night_min < TH.glucose_low).length, nw = win.filter(x => x.weight == null).length;
  const calls = win.filter(x => x.calls).length, rs = visibleReasons(d), sep = t("list_sep");
  const recs = [];
  if (d.congestion && !d.under_review) recs.push(t("sbar_r1"));
  if (hypos) recs.push(t("sbar_r2"));
  if (e || win.filter(x => !x.diuretic_taken).length >= 2) recs.push(t("sbar_r3"));
  if (!recs.length) recs.push(t("sbar_r0"));
  const items = [
    ["S", t("sbar_s"), d.level ? fmt(t("sbar_s1"), {r: rs.map(reasonText).join(sep)}) : t("sbar_s0")],
    ["B", t("sbar_b"), fmt(t("sbar_b_t"), {age: DATA.patient.age, dx: t("dx"), meds: UNIQUE_MEDS.map(m => m["rx_" + lang]).join(sep), w: num(B.weight.median, 1), a: num(B.ankle.median)})],
    ["A", t("sbar_a"), fmt(t("sbar_a_t"), {med: medAdh(win), ep: e ? 1 : 0, hypo: hypos, calls, nw})],
    ["R", t("sbar_r"), recs.join("<br>")],
  ];
  $("sbarBox").innerHTML = items.map(([k, l, v]) => `<div><b><i>${k}</i>${l}</b>${v}</div>`).join("");
}
function renderDoctor() {
  const win = windowDays(), d = DAYS[cur], e = episodeIn(win);
  $("pinfo").innerHTML = [
    [t("name"), `${t("patient_name")} · ${DATA.patient.id}`], [t("age"), `${DATA.patient.age} ${t("years")}`], [t("diagnosis"), t("dx")],
    [t("meds_l"), UNIQUE_MEDS.map(m => m["rx_" + lang]).join("<br>")], [t("dr"), t("physician")],
    [t("base_l"), `${num(B.weight.median, 1)} ${t("kg")} · ${num(B.ankle.median)} ${t("mm")} · SpO₂ ${num(B.spo2.median)}%`],
  ].map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join("");
  $("aiText").textContent = aiSummary(win);
  renderSBAR(win);
  const diet = Math.round(win.filter(x => x.diet_ok).length / win.length * 100);
  const meas = Math.round(win.filter(x => x.weight != null && x.spo2 != null && !x.suspect).length / win.length * 100);
  const cnt = s => win.filter(x => (x.streams || []).includes(s)).length;
  const fa = win.filter(x => x.false_alarm_blocked).length;
  $("kpis").innerHTML = [
    [t("k_med"), `${medAdh(win)}<small>%</small>`], [t("k_diet"), `${diet}<small>%</small>`], [t("k_meas"), `${meas}<small>%</small>`],
    [t("k_streams"), `<span style="font-size:15px;line-height:1.9;display:block">${["clinical", "glucose", "adherence"].map(s => `<span class="stag ${s}">${t("stream_" + s)} ${cnt(s)}</span>`).join(" ")}</span>`],
    [t("k_fa"), fa], [t("k_early"), e && cur >= e.symptoms_day ? `${e.symptoms_day - e.first_alert} <small>${t("days")}</small>` : "—"],
  ].map(([k, v]) => `<div class="kpi"><small>${k}</small><b>${v}</b></div>`).join("");
  drawCharts(win);
  const g = $("gapBox");
  if (e && cur >= e.first_alert) {
    g.innerHTML = `<p style="margin:0 0 12px;line-height:1.75">${fmt(t("gap_text"), {s: shortDate(DAYS[e.start].date), e: shortDate(DAYS[Math.min(e.end, cur)].date), m: e.missed_diuretic, salty: e.salty_days, early: e.symptoms_day - e.first_alert})}</p>
      <div class="gap"><div><small>${t("g_missed")}</small><b>${e.missed_diuretic}</b></div><div><small>${t("g_peak_w")}</small><b>+${e.peak_weight_gain} ${t("kg")}</b></div><div><small>${t("g_peak_a")}</small><b>+${e.peak_ankle_gain} ${t("mm")}</b></div><div><small>${t("g_early")}</small><b>${e.symptoms_day - e.first_alert} ${t("days")}</b></div></div>`;
  } else g.innerHTML = `<p class="muted" style="margin:0">${t("gap_none")}</p>`;
  const rows = win.filter(x => x.level || x.false_alarm_blocked || x.suspect || x.reviewed || x.notes.some(n => n[0] === "evening_swelling")).reverse();
  const acts = x => {
    if (!x.actions.length) return x.reviewed ? t("nt_reviewed") : t("a_none");
    return x.actions.map(a => t("a_" + a)).join("<br>") + (x.calls ? `<br><b>${fmt(t("a_called"), {who: contactName(x.calls.by)})}</b>` : "");
  };
  $("logTbl").innerHTML = `<tr><th>${t("l_date")}</th><th>${t("l_level")}</th><th>${t("l_what")}</th><th>${t("l_action")}</th></tr>` +
    (rows.length ? rows.map(x => `<tr><td style="white-space:nowrap">${shortDate(x.date)}</td><td><span class="lvtag" style="background:${x.level ? alertColor(x) : LV_COLOR[0]}">${x.level ? t("L" + x.level) : "—"}</span><div style="margin-top:4px">${streamTags(x)}</div></td><td>${[...visibleReasons(x).map(reasonText), ...x.notes.map(noteText)].join("<br>")}</td><td>${acts(x)}</td></tr>`).join("")
      : `<tr><td colspan="4" class="muted">${t("feed_none")}</td></tr>`);
}

const PL = {displayModeBar: false, responsive: true};
function layout(extra) {

    font: {family: "IBM Plex Sans Arabic, IBM Plex Sans, sans-serif", size: 12, color: "#4A5A70"},

function shapes(extra = []) {

function renderHow() {
  const card = (b, k) => `<div class="step"><b>${b}</b><h4>${t(k + "t")}</h4><p>${t(k)}</p></div>`;
  $("hwChips").innerHTML = t("hw_chips").map(c => `<span>${c}</span>`).join(`<i>${lang === "ar" ? "‹" : "›"}</i>`);
  $("flowIn").innerHTML = [["🦶", "fl1"], ["🧠", "fl2"]]
    .map(([ic, k]) => `<div class="fstep"><div class="ic">${ic}</div><div><h4>${t(k + "t")}</h4><p>${t(k)}</p></div></div>`)
    .join(`<div class="arr" aria-hidden="true">←</div>`);
  $("flowOut").innerHTML = [["📱", 1, "1", "var(--med)", "var(--medbg)"], ["👨‍👩‍👧", 2, "2", "var(--warn)", "var(--warnbg)"],
    ["🩺", 3, "3", "var(--crit)", "var(--critbg)"], ["📞", 4, lang === "ar" ? "3 و4" : "3–4", "var(--emerg)", "var(--critbg)"]]
    .map(([ic, i, n, c, cb]) => `<div class="ocard" style="--c:${c};--cb:${cb}"><div class="top"><span class="ic">${ic}</span><span class="lv">${fmt(t("lv_badge"), {n})}</span></div><h4>${t("out" + i + "t")}</h4><p>${t("out" + i)}</p></div>`).join("");
  $("featBox").innerHTML = `<div class="fimg"><img src="${BAND_IMG}" alt="HydroTrack"><small>${t("feat_img")}</small></div>` +
    [["🦶", 1], ["🫁", 2], ["🚶", 3], ["🔐", 4], ["💧", 5]]
      .map(([ic, i]) => `<div class="fcard${i === 5 ? " wide" : ""}"><div class="hd"><span class="ic">${ic}</span><h4>${t("ft" + i + "t")}</h4></div><ul>${t("ft" + i).map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("");
  $("payBox").innerHTML = [["🔁", 1], ["🏥", 2], ["📱", 3], ["🔗", 4]].map(([ic, i]) => card(ic, "pay" + i)).join("");
  $("safeBox").innerHTML = [["🩺", 1], ["🔒", 2], ["📜", 3], ["📊", 4]].map(([ic, i]) => card(ic, "safe" + i)).join("");
}
function openDiet() {
  const h = [t("breakfast"), t("lunch"), t("dinner")];
  $("dietTbl").innerHTML = `<table><tr><th></th>${h.map(x => `<th>${x}</th>`).join("")}</tr>${DIET[lang].map((r, i) => `<tr><th>${t("wd")[i]}</th>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>
    <h4 style="margin:16px 0 8px">🚫 ${t("show_no").replace(" ›", "")}</h4><div class="no">${AVOID[lang].map(([a, b]) => `<div><span>${a}</span><span>${b}</span></div>`).join("")}</div>`;
  $("dietModal").classList.add("on");
}
const reportUrl = () => location.href.split(/[?#]/)[0] + `?view=doctor&day=${cur + 1}&lang=${lang}`;
function openShare() {
  const box = $("qr");
  if (window.qrcode) { const q = qrcode(0, "M"); q.addData(reportUrl()); q.make(); box.innerHTML = q.createSvgTag({cellSize: 5, margin: 2, scalable: true}); }
  else box.innerHTML = `<div class="muted" style="font-size:12px;word-break:break-all">${reportUrl()}</div>`;
  $("shareModal").classList.add("on");
}

/* ------------------------------------------------------------------ shell */
function renderStatic() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  $("langBtn").textContent = lang === "ar" ? "English" : "العربية";
  renderVoiceTriggers(); renderHow();
}
function render() {
  const d = DAYS[cur];
  $("slider").value = cur;
  $("dayLbl").textContent = `${t("day")} ${cur + 1} ${t("of")} ${DAYS.length}`;
  $("dateLbl").textContent = `${t("wd")[weekday(d.date)]} · ${dateStr(d.date)}`;
  if (view === "patient") { renderPatient(); renderVoice(); renderEngine(); }
  if (view === "band") renderBand();
  if (view === "family") renderFamily();
  if (view === "doctor") renderDoctor();
}
function go(day) { cur = Math.max(0, Math.min(DAYS.length - 1, day)); voiceMode = null; convo = []; manualSwell = false; render(); }
function stop() { clearInterval(playing); playing = null; $("play").textContent = "▶"; }
function step() {
  const before = DAYS[cur];
  go(cur + 1);
  const d = DAYS[cur];
  const escalated = d.level > before.level || (d.level && (d.streams || []).join() !== (before.streams || []).join());
  if (view === "patient" && escalated) { const m = autoMode(d); if (m) fire(m); }
  if (view === "family" && d.calls && !before.calls) setTimeout(ringIncoming, 400);
}
function play(from, to, ms = 1300, after) {
  stop(); if (from != null) go(from);
  $("play").textContent = "❚❚";
  playing = setInterval(() => { if (cur >= (to ?? DAYS.length - 1)) { stop(); after && after(); return; } step(); }, ms);
}
function show(v) {
  view = v;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x.dataset.v === v));
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  render();
  if (v === "doctor") setTimeout(() => document.querySelectorAll(".plot").forEach(p => window.Plotly && Plotly.Plots.resize(p)), 60);
}

$("slider").oninput = e => { stop(); go(+e.target.value); };
$("prev").onclick = () => { stop(); go(cur - 1); };
$("next").onclick = () => { stop(); step(); };
$("play").onclick = () => playing ? stop() : play();
document.querySelectorAll("[data-sc]").forEach(b => b.onclick = () => {
  const sc = b.dataset.sc;
  if (sc === "normal") { stop(); go(20); }
  if (sc === "false") play(37, 40);
  if (sc === "wedding") { if (view === "patient" || view === "how") show("band"); play(44, 47, 1600); }
  if (sc === "sugar") { show("family"); play(48, 50, 1200); }
  if (sc === "episode") play(64, 73, 1400);
  if (sc === "after") { stop(); go(85); }
});
$("tabs").onclick = e => { const b = e.target.closest("button"); if (b) show(b.dataset.v); };
$("period").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  period = +b.dataset.p; document.querySelectorAll("#period button").forEach(x => x.classList.toggle("on", x === b)); renderDoctor();
};
$("langBtn").onclick = () => { lang = lang === "ar" ? "en" : "ar"; convo = []; renderStatic(); render(); };
$("hearing").onchange = e => { hearing = e.target.checked; if (hearing) speechSynthesis && speechSynthesis.cancel(); renderVoice(); };
$("swell").oninput = e => { manualSwell = true; setSwellUI(+e.target.value); };
$("printBtn").onclick = () => window.print();
$("closeDiet").onclick = () => $("dietModal").classList.remove("on");
$("closeShare").onclick = () => $("shareModal").classList.remove("on");
$("openReport").onclick = () => { $("shareModal").classList.remove("on"); show("doctor"); window.scrollTo(0, 0); };
["dietModal", "shareModal"].forEach(id => $(id).onclick = e => { if (e.target.id === id) e.currentTarget.classList.remove("on"); });
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

const params = new URLSearchParams(location.search);
if (params.get("lang") === "en") lang = "en";
if (params.get("day")) cur = Math.max(0, Math.min(DAYS.length - 1, +params.get("day") - 1));
renderStatic();
show(["patient", "band", "family", "doctor", "how"].includes(params.get("view")) ? params.get("view") : "patient");

</script>
